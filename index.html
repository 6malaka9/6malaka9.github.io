  overflow-x: hidden;

@keyframes AnimateBG {

  }
  50% {

  }
  100% {
    background-position: 0% 50%;

.container {

  backdrop-filter: blur(18px);

    inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
a,a:link,a:visited,a:hover,a:active {
  text-decoration: none;
  color: inherit;
}
.offset {
  --color: #4b91f1;
  --hover: #1973bc;
  position: relative;
  overflow: hidden;
  box-shadow:
    5px 5px 0 0 var(--color),
    inset 5px 5px 0 0 var(--color);
  transition:
    box-shadow 0.35s ease,
    transform 0.35s ease;
}
.offset:hover,
.offset:focus {
  box-shadow:
    0 0 0 0 var(--hover),
    inset 10em 4em 0 0 var(--hover);
}
.offset a {
  display: block;
  padding: 8px 16px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 2.875rem;
  transition:
    letter-spacing 0.3s ease,
    color 0.3s ease;
}
ul {
  list-style-type: none;
  margin: 0;
  padding: 0 10px 10px;
}
li {
  max-width: 300px;
  margin: 1.375rem auto 0;
  background: rgba(255, 255, 255, 0.96);
  border: 2px solid rgba(255, 255, 255, 0.75);
  border-radius: 12px;
  font: inherit;
  color: var(--color);
  box-shadow: 0 6px 18px rgba(32, 30, 90, 0.10);
  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    background 0.3s ease,
    border-color 0.3s ease,
    color 0.3s ease;
}
li:hover,
li:focus-within {
  border-color: var(--hover);
  color: #fff;
  background: rgba(255, 255, 255, 0.08);

  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(35, 20, 90, 0.22);
}
li:hover .offset,
li:focus-within .offset {
  --hover: #1973bc;
}
li:hover .offset a,
li:focus-within .offset a {
  letter-spacing: 2.5px;
}

h1 {
  margin: 0 0 24px;
  font-size: clamp(28px, 5vw, 36px);
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1.4;
  text-shadow: 0 4px 18px rgba(45, 20, 90, 0.18);
}
X {

  font: inherit;
  text-shadow: 0 0 18px rgba(255, 229, 138, 0.35);

.foot {

@media (max-width: 767px) {

@media (max-width: 320px) {

    font-size: 14px;
    letter-spacing: 1px;
  }
}
@media (prefers-reduced-motion: reduce) {
  body {
    animation: none;
  }
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}
